<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eco-MaxiDeka - Login</title>
  <style>
    :root {
      --primary-color: #6BA53A;
      --secondary-color: #4D7F2F;
      --bg-light: #F4F7F2;
      --text-dark: #2C3E2E;
      --white: #FFFFFF;
      --border-radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-light); color: var(--text-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .app-container {
      width: 100%; max-width: 420px; height: 100vh; max-height: 880px;
      background: var(--white); display: flex; flex-direction: column;
      position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.08); overflow: hidden; border-radius: 16px;
    }
    
    .auth-container { padding: 40px 24px; display: flex; flex-direction: column; justify-content: center; height: 100%; text-align: center; }
    .auth-title { font-size: 1.8rem; color: var(--secondary-color); margin-bottom: 8px; }
    .auth-subtitle { color: #666; margin-bottom: 30px; font-size: 0.95rem; }
    
    .input-field { width: 100%; padding: 14px; border: 1px solid #E0E0E0; border-radius: var(--border-radius); margin-bottom: 15px; font-size: 0.95rem; outline: none; text-align: left; }
    .input-field:focus { border-color: var(--primary-color); }
    
    .btn { background: var(--primary-color); color: var(--white); padding: 14px; border: none; border-radius: var(--border-radius); width: 100%; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: var(--secondary-color); }
    
    .auth-footer { margin-top: 25px; text-align: center; font-size: 0.9rem; color: #666; }
    .auth-footer a { color: var(--primary-color); text-decoration: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <main class="app-container">
    <div class="auth-container">
      <img src="../../../../images/logo.jpeg" alt="Logo Eco-MaxiDeka" style="width: 130px; margin: 0 auto 15px auto; display: block;">

      <h2 class="auth-title">Bem-vindo!</h2>
      <p class="auth-subtitle">Acesse sua conta para continuar.</p>

      <form id="loginForm">
        <input type="email" id="loginEmail" class="input-field" placeholder="E-mail" required>
        <input type="password" id="loginPassword" class="input-field" placeholder="Senha" required>
        <button type="submit" class="btn">Entrar</button>
      </form>

      <div class="auth-footer">
        Não tem uma conta? <a href="casdasto.html">Cadastre-se</a>
      </div>
    </div>
  </main>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
