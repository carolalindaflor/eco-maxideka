<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eco-MaxiDeka - Início</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    :root {
      --primary-color: #6BA53A;
      --secondary-color: #4D7F2F;
      --bg-light: #F4F7F2;
      --text-dark: #2C3E2E;
      --white: #FFFFFF;
      --border-radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-light); color: var(--text-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .app-container {
      width: 100%; max-width: 420px; height: 100vh; max-height: 880px;
      background: var(--white); display: flex; flex-direction: column;
      position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.08); overflow: hidden; border-radius: 16px;
    }

    .app-header {
      padding: 20px;
      background: var(--white);
      border-bottom: 1px solid #F0F0F0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-header h2 {
      color: var(--secondary-color);
      font-size: 1.25rem;
    }

    .content-area {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      padding-bottom: 80px; /* Espaço para o menu inferior não cobrir o conteúdo */
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 15px;
    }

    .card-category {
      background: #F9FBF8;
      border: 1px solid #E8EFE5;
      border-radius: var(--border-radius);
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .card-category:active {
      transform: scale(0.98);
    }

    .card-category .icon {
      font-size: 2rem;
      margin-bottom: 10px;
      display: block;
    }

    .card-category h3 {
      font-size: 0.95rem;
      color: var(--text-dark);
    }

    .btn {
      background: var(--primary-color);
      color: var(--white);
      padding: 14px;
      border: none;
      border-radius: var(--border-radius);
      width: 100%;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--secondary-color);
    }

    /* BARRA DE NAVEGAÇÃO INFERIOR */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background: var(--white);
      border-top: 1px solid #E0E0E0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      color: #666;
      cursor: pointer;
      gap: 3px;
    }

    .nav-item.active {
      color: var(--primary-color);
      font-weight: bold;
    }

    .nav-item .nav-icon {
      font-size: 1.3rem;
    }
  </style>
</head>
<body>

  <main class="app-container">
    <header class="app-header">
      <h2>Eco-MaxiDeka</h2>
      <span>🌱 120 pts</span>
    </header>

    <div class="content-area">
      <h3>O que você quer reciclar hoje?</h3>
      
      <div class="categories-grid">
        <div class="card-category" onclick="navigateTo('categories.html')">
          <span class="icon">♻️</span>
          <h3>Plástico</h3>
        </div>
        <div class="card-category" onclick="navigateTo('categories.html')">
          <span class="icon">📄</span>
          <h3>Papel</h3>
        </div>
        <div class="card-category" onclick="navigateTo('categories.html')">
          <span class="icon">🍾</span>
          <h3>Vidro</h3>
        </div>
        <div class="card-category" onclick="navigateTo('categories.html')">
          <span class="icon">🔋</span>
          <h3>Baterias</h3>
        </div>
      </div>

      <button class="btn" style="margin-top: 25px;" onclick="navigateTo('scanner.html')">
        📷 Escanear Resíduo
      </button>
    </div>

    <!-- MENU DE NAVEGAÇÃO FIXO NO RODAPÉ -->
    <nav class="bottom-nav">
      <button class="nav-item active" onclick="navigateTo('home.html')">
        <span class="nav-icon">🏠</span>
        <span>Início</span>
      </button>

      <button class="nav-item" onclick="navigateTo('categories.html')">
        <span class="nav-icon">📦</span>
        <span>Categorias</span>
      </button>

      <button class="nav-item" onclick="navigateTo('scanner.html')">
        <span class="nav-icon">📷</span>
        <span>Escanear</span>
      </button>

      <button class="nav-item" onclick="navigateTo('profile.html')">
        <span class="nav-icon">👤</span>
        <span>Perfil</span>
      </button>
    </nav>
  </main>

  <!-- Importação dos Scripts de Navegação -->
  <script src="../js/script.js"></script>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
