<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eco-MaxiDeka - Scanner</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .scanner-view {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
    }
    video {
      width: 100%;
      height: 75%;
      object-fit: cover;
    }
    .scanner-controls {
      padding: 20px;
      background: var(--white);
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <main class="app-container">
    <div class="scanner-view">
      <video id="webcam" autoplay playsinline></video>
      <div class="scanner-controls">
        <button class="btn" onclick="captureAndAnalyze()">Identificar Objeto</button>
        <button class="btn" style="background: #ccc; color: #333;" onclick="location.href='home.html'">Voltar</button>
      </div>
    </div>
  </main>

  <script>
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        document.getElementById('webcam').srcObject = stream;
      } catch (err) {
        alert("Não foi possível acessar a câmera: " + err.message);
      }
    }

    function captureAndAnalyze() {
      alert("Analisando resíduo com IA...");
    }

    window.addEventListener('DOMContentLoaded', initCamera);
  </script>
</body>
</html>
